plugins {
    id 'java'
}

def querydsl = project.property('querydsl.version').toString()
def springBoot = project.property('spring-boot.version').toString()

def mockito = project.property('mockito.version').toString()
def junit = project.property('junit.version').toString()
def junitLauncher = project.property('junit-launcher.version').toString()
def assertj = project.property('assertj.version').toString()

dependencies {
    compileOnly "org.springframework.boot:spring-boot-starter-data-jpa:${springBoot}"
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydsl}"
    implementation "io.github.openfeign.querydsl:querydsl-core:${querydsl}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydsl}:jakarta"

    // 테스트용 라이브러리
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa:${springBoot}"
    testImplementation "org.mockito:mockito-core:${mockito}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junit}"
    testImplementation "org.junit.platform:junit-platform-launcher:${junitLauncher}"
    testImplementation "org.assertj:assertj-core:${assertj}"
}

sourceSets {
    main {
        java {
            srcDir "build/generated/source/kapt/main"
        }
    }
}
